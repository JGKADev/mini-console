[package]
name = "mini-console"
version = "0.1.0"
edition = "2024"
description = "Mini Console: an unofficial control app for the TC-Helicon GoXLR Mini"
license = "MIT"

[dependencies]
anyhow = "1"
libloading = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_UI_Shell"] }
serde_json = "1"
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }
ctrlc = "3"
wry = "0.57.0"
tao = "0.37.1"
# Core Audio peak meters for the PC channels (same version wry already pulls in).
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Foundation"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
